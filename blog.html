<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiden Lara | Software Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* YUUPP im kinda a pro a gradient background */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #461719, #7f5fff, #008cff, #fd5760);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: -2;
        }

        /* im really not well versed in this */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* this is so that the particles are like behind everything, they dont move as you scroll maybe will add that later*/
        /* Just the whole screen and then with a z index of -1 */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            /* I dont think it would be possible to like select the particle canvas but I saw that this was used in similar
            like projects so Imma just keep this */
            pointer-events: none;
        }

        html {
            scroll-behavior: smooth;
            -ms-overflow-style: none;  /* This is to get rid of the scroll bar */
            scrollbar-width: none; 
        }

        /* just in case */
        body {
            padding-top: 0;
        }

        
        /* I like the way this nav bar looks I think it works well for the overall like design of the site */
        nav {
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* This is for the project cards i really dont know if I like these ngl im on the fence
        and might look for another design */
        .project-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .project-card:hover::before {
            left: 100%;
        }

        .project-card:hover {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            font-size: 0.85rem;
            margin: 2px;
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        /* I am thinking about changing these as well tbh */
        .blog-item {
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .blog-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 80%;
            background: rgba(255, 255, 255, 0.1);
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .blog-item:hover::before {
            width: 4px;
        }

        .blog-item:hover {
            padding-left: 15px;
        }

        /* Tag badges 
        I want to maybe actually do something with these like you click them and it brings up
        like everything that uses them.*/
        .tag {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            font-size: 0.85rem;
            margin: 2px;
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        /* Nav links */
        .nav-link {
            position: relative;
            padding-bottom: 4px;
            transition: color 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: white;
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }
    </style>
</head>
<body class="text-white">
    <!-- Background -->
    <div class="gradient-bg"></div>
    <canvas id="particle-canvas"></canvas>

    <div class="mb-4">This div has a bottom margin.</div>

    <!-- Navigation -->
    <nav class="fixed top-0 w-full z-50">
        <div class="max-w-6xl mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="text-2xl font-bold">Aiden Lara</div>
                <div class="flex items-center space-x-8">
                    <a href="#about_anchor" class="nav-link hover:text-gray-300">About</a>
                    <a href="#projects_anchor" class="nav-link hover:text-gray-300">Projects</a>
                    <a href="#blog_anchor" class="nav-link hover:text-gray-300">Blog</a>
                    <a href="#resume" class="nav-link hover:text-gray-300">Resume</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-6 py-12">
        <h1 class="text-5xl font-bold mb-4 fade-in">Blog Posts</h1>
        <p class="text-xl text-gray-200 mb-12 fade-in fade-in-delay-1">Blog posts</p>

        <div id="blogs-container" class="grid md:grid-cols-2 gap-8">
            <div class="col-span-2 text-center py-12">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-white"></div>
                <p class="mt-4 text-gray-300">Loading Blogs...</p>
            </div>
        </div>
    </div>
        
    <!-- Footer -->
    <footer class="bg-black/20 py-6 text-center border-t border-white/10">
        <p class="text-gray-300">Aiden Lara</p>
        <p class="text-gray-400 text-sm mt-1">Hi this is the footer there isnt anything below this.</p>
    </footer>

    <script src="background_particles.js"></script>
    <script>
        async function loadProjects() {
            try {
                const response = await fetch('blog-metadata.json');
                const projects = await response.json();
                
                projects.sort((a, b) => a.order - b.order);
                
                const container = document.getElementById('blogs-container');
                container.innerHTML = '';
                
                projects.forEach((project, index) => {
                    const delayClass = `fade-in-delay-${Math.min(index + 1, 6)}`;
                    
                    const tags = project.tags.map(tag => 
                        `<span class="tag">${tag}</span>`
                    ).join('');
                    
                    const links = [];
                    if (project.github) {
                        links.push(`<a href="${project.github}" target="_blank" class="text-blue-300 hover:text-blue-200">GitHub →</a>`);
                    }
                    if (project.demo) {
                        const demoText = project.demo.includes('youtube') ? 'Demo Video' : 
                                        project.demo === 'index.html' ? "You're Here!" : 'Live Demo';
                        links.push(`<a href="${project.demo}" ${!project.demo.includes('index.html') ? 'target="_blank"' : ''} class="text-blue-300 hover:text-blue-200">${demoText} →</a>`);
                    }
                    
                    const projectHTML = `
                        <div id="${project.id}" class="project-card fade-in ${delayClass}">
                            <h3 class="text-2xl font-semibold mb-3">${project.title}</h3>
                            <p class="text-gray-200 mb-4">
                                ${project.description}
                            </p>
                            <div class="mb-4">
                                ${tags}
                            </div>
                            <div class="flex gap-4">
                                ${links.join('')}
                            </div>
                        </div>
                    `;
                    
                    container.innerHTML += projectHTML;
                });
            } catch (error) {
                console.error('Error loading projects:', error);
                document.getElementById('projects-container').innerHTML = `
                    <div class="col-span-2 text-center py-12">
                        <p class="text-red-300">Error loading projects. Please try again later.</p>
                    </div>
                `;
            }
        }

        loadProjects();
    </script>
    <script>
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        document.querySelectorAll('.fade-in').forEach(el => {
            observer.observe(el);
        });
    </script>
</body>
</html>
