    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* YUUPP im kinda a pro a gradient background */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #461719, #7f5fff, #008cff, #fd5760);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            z-index: -2;
        }

        /* im really not well versed in this */
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* this is so that the particles are like behind everything, they dont move as you scroll maybe will add that later*/
        /* Just the whole screen and then with a z index of -1 */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            /* I dont think it would be possible to like select the particle canvas but I saw that this was used in similar
            like projects so Imma just keep this */
            pointer-events: none;
        }

        html {
            scroll-behavior: smooth;
            -ms-overflow-style: none;  /* This is to get rid of the scroll bar */
            scrollbar-width: none; 
        }

        /* just in case */
        body {
            padding-top: 0;
        }

        
        /* I like the way this nav bar looks I think it works well for the overall like design of the site */
        nav {
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* This is for the project cards i really dont know if I like these ngl im on the fence
        and might look for another design */
        .project-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .project-card:hover::before {
            left: 100%;
        }

        .project-card:hover {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            font-size: 0.85rem;
            margin: 2px;
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        /* blog card is a more accurate name i feel like*/
        /* 😭 Im really like not content with these at all I gotta look for some other cards */
        .blog-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 24px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .blog-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 0;
            background: linear-gradient(180deg, #7f5fff, #008cff);
            transition: height 0.3s ease;
        }

        .blog-card:hover::before {
            height: 100%;
        }

        /* Tag badges 
        I want to maybe actually do something with these like you click them and it brings up
        like everything that uses them.*/
        .tag {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            font-size: 0.85rem;
            margin: 2px;
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        /* Nav links */
        .nav-link {
            position: relative;
            padding-bottom: 4px;
            transition: color 0.3s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: white;
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }
    </style>
</head>

    <div class="max-w-4xl mx-auto px-6 py-12">
        <h1 class="text-5xl font-bold mb-4 fade-in">Blog</h1>
        <p class="text-xl text-gray-200 mb-12 fade-in fade-in-delay-1">Thoughts on graphics programming, web development, and software engineering.</p>

        <div id="blogs-container" class="space-y-6">
            <!-- Blog posts will be loaded dynamically -->
            <div class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-white"></div>

    </footer>

    <script src="background_particles.js"></script>

    <script>
        async function loadBlogPosts() {
            try {
                const response = await fetch('blog-metadata.json');
                const posts = await response.json();
                
                const container = document.getElementById('blogs-container');
                container.innerHTML = ''; // Clear loading spinner
                
                posts.forEach((post, index) => {
                    const delayClass = `fade-in-delay-${Math.min(index + 1, 8)}`;
                    const formattedDate = new Date(post.date).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                    
                    const tags = post.tags.map(tag => 
                        `<span class="tag">${tag}</span>`
                    ).join('');
                    
                    const postHTML = `
                        <div id="${post.id}" class="blog-card fade-in ${delayClass}" onclick="window.location.href='post.html?id=${post.id}'">
                            <div class="flex justify-between items-start mb-3">
                                <h2 class="text-2xl font-semibold">${post.title}</h2>
                                <span class="text-gray-400 text-sm whitespace-nowrap ml-4">${formattedDate}</span>
                            </div>
                            <p class="text-gray-200 mb-4">
                                ${post.description}
                            </p>
                            <div class="mb-3">
                                ${tags}
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-blue-300 hover:text-blue-200">Read Full Article →</span>
                                <span class="text-gray-400 text-sm">${post.readTime}</span>
                            </div>
                        </div>
                    `;
                    
                    container.innerHTML += postHTML;
                });
            } catch (error) {
                console.error('Error loading blog posts:', error);
                document.getElementById('blogs-container').innerHTML = `
                    <div class="text-center py-12">
                        <p class="text-red-300">Error loading blog posts. Please try again later.</p>
                    </div>
                `;
            }
        }

        // Load posts when page loads
        loadBlogPosts();
    </script>
    <script>
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });

        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);

        document.querySelectorAll('.fade-in').forEach(el => {
            observer.observe(el);
        });
    </script>
